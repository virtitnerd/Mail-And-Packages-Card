# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # init and analyze must always run the same CodeQL version, or the
      # analysis fails with a config/version mismatch. Update them together.
      codeql-action:
        patterns:
          - "github/codeql-action/*"

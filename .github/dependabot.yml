# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    groups:
      # Each group lands as one PR so the toolchain moves together.
      rollup:
        patterns:
          - "rollup"
          - "rollup-plugin-*"
          - "@rollup/*"
      lint:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@typescript-eslint/*"
          - "prettier"
          - "lint-staged"
          - "husky"
      runtime:
        patterns:
          - "lit"
          - "custom-card-helpers"
          - "tslib"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    groups:
      # init and analyze must always run the same CodeQL version, or the
      # analysis fails with a config/version mismatch. Update them together.
      codeql-action:
        patterns:
          - "github/codeql-action/*"

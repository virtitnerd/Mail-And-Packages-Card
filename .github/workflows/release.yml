name: Release

on:
  release:
    types: [published]

permissions: {}

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run rollup

      - name: Inject release version
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          CLEAN_VERSION="${TAG_NAME#v}"
          sed -i "s/0\.0\.0-dev/${CLEAN_VERSION}/g" dist/Home-Assistant-Mail-And-Packages-Custom-Card.js

      - name: Upload JS to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/Home-Assistant-Mail-And-Packages-Custom-Card.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
